<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>天國主頁</title>

<style>
    body {
        margin: 0;
        display: flex;
        height: 100vh;
        font-family: "Microsoft JhengHei", sans-serif;
        background: #111;
    }

    /* 左側 Sidebar */
    .sidebar {
        width: 240px;
        background: #222;
        color: white;
        padding-top: 20px;
        box-shadow: 2px 0 10px rgba(0,0,0,0.4);
    }

    .sidebar button {
        width: 100%;
        padding: 18px;
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        text-align: left;
        cursor: pointer;
        transition: 0.3s;
    }

    .sidebar button:hover {
        background: #444;
    }

    /* 右側內容區 */
    .content {
        flex: 1;
        background: black;
        overflow: auto;
        position: relative;
    }

    /* 讓嵌入的 HTML 區塊能覆蓋整個右側 */
    .page {
        display: none;
        width: 100%;
        height: 100%;
    }

    .page.active {
        display: block;
    }
</style>

</head>
<body>

<!-- ⭐ 左側 Sidebar -->
<div class="sidebar">
    <button onclick="showPage('page1')">天國＝生命樹</button>
    <button onclick="showPage('page2')">芥菜種的比喻</button>
</div>

<!-- ⭐ 右側內容區 -->
<div class="content">

    <!-- ⭐ Page1：天國＝生命樹.html -->
    <div id="page1" class="page active">
        <!-- 把你的「天國＝生命樹.html」全部貼進來 -->
        <iframe src="天國=生命樹.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <!-- ⭐ Page2：芥菜種的比喻.html -->
    <div id="page2" class="page">
        <!-- 把你的「芥菜種的比喻.html」全部貼進來 -->
        <iframe src="芥菜種的比喻.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

</div>

<script>
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
